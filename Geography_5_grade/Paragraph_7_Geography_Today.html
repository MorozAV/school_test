<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>География сегодня</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column; menu of blocks -> question card -> results. Progress is a string of beads. */
:root{
  color-scheme:light;
  --bg:#eef2f8; --surface:#ffffff; --ink:#14243d; --muted:#56657d; --line:#d5deeb;
  --accent:#24508f; --accent-ink:#ffffff; --good:#2f7d3a; --good-bg:#e5f3e3; --bad:#c03a2b; --bad-bg:#fbe6e2;
  --display:"PT Serif", Georgia, serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1828; --surface:#172338; --ink:#e3e9f3; --muted:#a6b4ca; --line:#2c3b55;
  --accent:#8fb6f0; --accent-ink:#0f1828; --good:#6fcf7d; --good-bg:#1e3521; --bad:#ff8a7a; --bad-bg:#43211c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1828; --surface:#172338; --ink:#e3e9f3; --muted:#a6b4ca; --line:#2c3b55;
  --accent:#8fb6f0; --accent-ink:#0f1828; --good:#6fcf7d; --good-bg:#1e3521; --bad:#ff8a7a; --bad-bg:#43211c;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.lead{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* timeline strip on the menu */
.eras{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.era{border-top:5px solid var(--accent);padding-top:6px;font-size:.82rem;color:var(--muted);min-width:0}
.era:nth-child(2){opacity:.85} .era:nth-child(3){opacity:.7} .era:nth-child(4){opacity:.55}
.era b{display:block;color:var(--ink);font-size:.92rem}

/* menu */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.block:hover{transform:translateY(-2px);border-color:var(--accent)}
.block .n{font-size:.8rem;font-weight:800;color:var(--accent)}
.block .meta{font-size:.85rem;color:var(--muted);margin-top:auto}
.block.final{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.block.final .n,.block.final .meta{color:var(--accent-ink);opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.home{font-weight:700;color:var(--muted);text-decoration:none;font-size:.92rem}
.home:hover{color:var(--accent)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.beads{display:flex;flex-wrap:wrap;gap:5px}
.bead{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.bead.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bead.ok{background:var(--good);border-color:var(--good)}
.bead.no{background:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qimg{width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#fff}
.qtext{font-size:1.15rem;font-weight:800}
.qhint{color:var(--muted);font-size:.92rem;margin-top:-8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.8rem;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.opt.picked .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb ol{margin:4px 0 0;padding-left:22px}

/* results */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.grade{font-family:var(--display);font-size:3.2rem;font-weight:700;width:92px;height:92px;border-radius:18px;display:grid;place-items:center;color:var(--accent-ink);background:var(--accent)}
.mist{display:flex;flex-direction:column;gap:10px}
.mi{border-left:4px solid var(--bad);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.mi .y{color:var(--bad)} .mi .c{color:var(--good);font-weight:700}
.mthumb{height:80px;width:auto;align-self:flex-start;border-radius:6px;background:#fff;margin-bottom:4px}

/* study */
.study{display:flex;flex-direction:column;gap:28px}
.study section{display:flex;flex-direction:column;gap:10px}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;padding-left:16px}
.tl li::before{content:"";position:absolute;left:-8.5px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl .d{display:block;font-weight:800;color:var(--accent);font-size:.92rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sc img{width:100%;height:150px;object-fit:contain;background:#fff}
.sc .t{padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.sc .t b{font-size:1rem}
.sc .yr{color:var(--muted);font-size:.82rem}
.terms{display:grid;gap:8px;margin:0}
.terms div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.terms dt{display:inline;font-weight:800}
.terms dd{display:inline;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.tbl td:nth-child(2){white-space:nowrap}
.qa{display:flex;flex-direction:column;gap:8px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qa summary{font-weight:800;cursor:pointer}
.qa details > div{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.qa ul,.qa ol{margin:0;padding-left:22px}
.note{color:var(--muted);font-size:.88rem}
@media (max-width:560px){.eras{grid-template-columns:repeat(2,1fr)} .qtext{font-size:1.05rem} .tbl{font-size:.85rem} .tbl th,.tbl td{padding:6px 7px} .tbl td:nth-child(2){white-space:normal}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.fig{width:100%;border-radius:10px;background:#fff}
</style>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, one, few, many) => { const t = n % 100, u = n % 10; return t >= 11 && t <= 14 ? many : u === 1 ? one : u >= 2 && u <= 4 ? few : many; };
const KEY = "geo7_geography_today_best";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};

/* ---------- question builders ---------- */
function picQs(){
  return PICS.filter(p => IMG[p.id]).flatMap(p => [p.q1, p.q2].map(x => {
    const w = x.w || shuffle(SOURCES.filter(s => s !== x.a)).slice(0, 3);
    return { block:"pics", img:p.id, q:x.q, a:x.a, opts: shuffle([x.a, ...w]), e:x.e };
  }));
}
const fromList = (list, block) => list.map(x => ({ block, img:x.img, q:x.q, a:x.a, opts: shuffle([x.a, ...x.w]), e:x.e }));
const orderQs = () => ORDER.map(x => ({ block:"order", type:"order", q:x.q, items:x.items, a:x.items.join(" → "), opts: shuffle(x.items), e:x.e }));

const BLOCKS = {
  pics:{n:"Блок 1", title:"Узнай по картинке", desc:"Снимки из космоса и рисунок «Источники географической информации».", make:()=>shuffle(picQs())},
  space:{n:"Блок 2", title:"Спутники и космос", desc:"Искусственные спутники, Юрий Гагарин, навигационные системы.", make:()=>shuffle(fromList(SPACE,"space"))},
  info:{n:"Блок 3", title:"Источники информации", desc:"Карты и атласы, справочники, путеводители, Интернет, ГИС.", make:()=>shuffle(fromList(INFO,"info"))},
  choose:{n:"Блок 4", title:"Где искать?", desc:"Выбери, какой источник поможет в жизненной ситуации.", make:()=>shuffle(fromList(CHOOSE,"choose"))},
  order:{n:"Блок 5", title:"Лента времени", desc:"Расставь события и шаги по порядку.", make:()=>shuffle(orderQs())},
  summary:{n:"Блок 6", title:"Обобщение по теме", desc:"Вся тема «Как люди открывали Землю»: от древности до наших дней.", make:()=>shuffle(fromList(SUMMARY,"summary"))},
  book:{n:"Блок 7", title:"Вопросы учебника", desc:"Вопросы, задания и «Запомните» из § 7.", make:()=>shuffle(fromList(BOOK,"book"))},
  final:{n:"Итог", title:"Контрольная проверка", desc:"20 случайных вопросов из всех блоков.", make:()=>shuffle([
    ...shuffle(picQs()).slice(0,2), ...shuffle(fromList(SPACE,"space")).slice(0,4), ...shuffle(fromList(INFO,"info")).slice(0,4),
    ...shuffle(fromList(CHOOSE,"choose")).slice(0,3), ...shuffle(orderQs()).slice(0,1),
    ...shuffle(fromList(SUMMARY,"summary")).slice(0,3), ...shuffle(fromList(BOOK,"book")).slice(0,3)
  ])}
};

/* ---------- screens ---------- */
let S = null; // quiz state

function menu(){
  S = null;
  const best = store.get() || {};
  const card = (k, cls="") => {
    const b = BLOCKS[k]; const count = k==="final" ? 20 : b.make().length;

    return `<button class="block ${cls}" data-go="${k}"><span class="n">${b.n}</span><h3>${b.title}</h3><span>${b.desc}</span><span class="meta">${count} ${k==="order" ? plural(count,"задание","задания","заданий") : plural(count,"вопрос","вопроса","вопросов")}${r}</span></button>`;
  };
  app.innerHTML = `
    <a class="home" href="../index.html">← Все тесты</a>
    <header style="display:flex;flex-direction:column;gap:10px">
      <span class="eyebrow">География · 5 класс · § 7</span>
      <h1>География сегодня</h1>
      <p class="lead">Как сегодня собирают информацию о Земле: спутники, космические снимки и навигационные системы. Где искать географическую информацию — от атласа до ГИС. И обобщение по всей теме «Как люди открывали Землю».</p>
    </header>
    <div class="eras">
      <div class="era"><b>Космос</b>спутники, Гагарин</div>
      <div class="era"><b>Источники</b>карты, книги, Интернет</div>
      <div class="era"><b>ГИС</b>электронные карты</div>
      <div class="era"><b>Обобщение</b>§§ 2–7</div>
    </div>
    <div class="blocks">${["pics","space","info","choose","order","summary","book"].map(k=>card(k)).join("")}${card("final","final")}</div>
    <div class="row"><button class="btn" id="study">Повторить материал перед тестом</button></div>`;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => start(b.dataset.go));
  $("#study").onclick = study;
  window.scrollTo(0,0);

function start(key, list){
  S = { key, qs: list || BLOCKS[key].make(), i:0, res:[], pick:[] };
  render();
}

function render(){
  const q = S.qs[S.i];
  S.pick = [];
  const beads = S.qs.map((_,k)=>{
    const r = S.res[k]; return `<span class="bead ${r===undefined ? (k===S.i?"cur":"") : (r.ok?"ok":"no")}"></span>`;
  }).join("");
  const img = q.img && IMG[q.img] ? `<img class="qimg" src="${IMG[q.img]}" alt="">` : "";
  const hint = q.type==="order" ? `<p class="qhint">Нажимай варианты по порядку. Нажмёшь ещё раз — отменишь выбор.</p>` : "";
  app.innerHTML = `
    <div class="qtop"><button class="btn ghost" id="back">← Меню</button><span class="eyebrow">${BLOCKS[S.key].title} · ${S.i+1} из ${S.qs.length}</span></div>
    <div class="beads" aria-hidden="true">${beads}</div>
    <div class="card">
      ${img}
      <p class="qtext">${esc(q.q)}</p>${hint}
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${q.type==="order"?"":k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>`;
  $("#back").onclick = menu;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => q.type==="order" ? pickOrder(+b.dataset.k) : answer(+b.dataset.k));
  window.scrollTo(0,0);
}

function pickOrder(k){
  if (S.res[S.i]) return;
  const q = S.qs[S.i]; const at = S.pick.indexOf(k);
  if (at >= 0) S.pick = S.pick.slice(0, at); else S.pick.push(k);
  app.querySelectorAll(".opt").forEach((b,j)=>{
    const n = S.pick.indexOf(j);
    b.classList.toggle("picked", n >= 0);
    b.querySelector(".k").textContent = n >= 0 ? n+1 : "";
  });
  $("#fb").innerHTML = S.pick.length === q.opts.length
    ? `<div class="row"><button class="btn primary" id="check">Проверить</button></div>` : "";
  if ($("#check")) { $("#check").onclick = checkOrder; $("#check").focus({preventScroll:true}); }
}

function checkOrder(){
  const q = S.qs[S.i]; const seq = S.pick.map(k => q.opts[k]);
  const ok = seq.join("|") === q.items.join("|");
  S.res[S.i] = { ok, pick: seq.join(" → ") };
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    b.classList.remove("picked");
    b.classList.add(q.items.indexOf(q.opts[j]) === S.pick.indexOf(j) ? "right" : "wrong");
  });
  const list = ok ? "" : `<ol>${q.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  feedback(ok, ok ? "Верно!" : "Порядок неверный. Правильно так:", list + `<span>${esc(q.e)}</span>`);
}

function answer(k){
  if (S.res[S.i]) return;
  const q = S.qs[S.i]; const pick = q.opts[k]; const ok = pick === q.a;
  S.res[S.i] = { ok, pick };
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if (q.opts[j] === q.a) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  feedback(ok, ok ? "Верно!" : "Неверно. Правильный ответ: " + esc(q.a), `<span>${esc(q.e)}</span>`);
}

function feedback(ok, head, body){
  const bead = app.querySelectorAll(".bead")[S.i]; bead.className = "bead " + (ok?"ok":"no");
  const last = S.i === S.qs.length - 1;
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${head}</b>${body}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${last?"Показать результат":"Дальше →"}</button></div>`;
  $("#next").onclick = () => { if (last) results(); else { S.i++; render(); } };
  $("#next").focus({preventScroll:true});
}

function grade(p){ return p>=90?5 : p>=70?4 : p>=50?3 : 2; }

function results(){
  const right = S.res.filter(r=>r.ok).length, total = S.qs.length, p = Math.round(right/total*100);
  const g = grade(p);
  if (!S.retry){ const best = store.get() || {}; if (!best[S.key] || p > best[S.key]) { best[S.key] = p; store.set(best); } }
  const wrong = S.qs.map((q,k)=>({q, r:S.res[k]})).filter(x=>!x.r.ok);
  const words = {5:"Отлично!",4:"Хорошо!",3:"Неплохо, но стоит повторить.",2:"Нужно ещё раз повторить параграф."};
  app.innerHTML = `
    <div class="qtop"><button class="btn ghost" id="back">← Меню</button><span class="eyebrow">${BLOCKS[S.key].title}${S.retry?" · работа над ошибками":""}</span></div>
    <div class="card">
      <div class="score"><div class="grade">${g}</div>
        <div style="display:flex;flex-direction:column;gap:4px"><h2>${words[g]}</h2><p>Правильно ${right} из ${total} (${p}%)</p>
        <p class="lead" style="font-size:.85rem">Оценка: 90% и больше — «5», 70% — «4», 50% — «3».</p></div></div>
      <div class="row">
        ${wrong.length?`<button class="btn primary" id="fix">Исправить ошибки (${wrong.length})</button>`:""}
        <button class="btn" id="again">Пройти заново</button>
        <button class="btn ghost" id="study2">Повторить материал</button>
      </div>
    </div>
    ${wrong.length?`<div class="card"><h2>Разбор ошибок</h2><div class="mist">${wrong.map(x=>`
      <div class="mi">${x.q.img&&IMG[x.q.img]?`<img class="mthumb" src="${IMG[x.q.img]}" alt="">`:""}<span>${esc(x.q.q)}</span><span class="y">Ответ: ${esc(x.r.pick)}</span><span class="c">Правильно: ${esc(x.q.a)}</span></div>`).join("")}</div></div>`:""}`;
  $("#back").onclick = menu;
  $("#study2").onclick = study;
  $("#again").onclick = () => start(S.key);
  if (wrong.length) $("#fix").onclick = () => {
    const key = S.key;
    const qs = shuffle(wrong.map(x => ({...x.q, opts: shuffle(x.q.opts)})));
    start(key, qs); S.retry = true;
  };
  window.scrollTo(0,0);
}

          <li><span class="d">XV–XVII века</span>Эпоха Великих географических открытий. Колумб открыл Америку, экспедиция Магеллана впервые обогнула земной шар. Рубежи ойкумены раздвинулись, определены контуры обитаемых материков. Развивались торговля, хозяйство, науки.</li>
          <li><span class="d">Российские путешественники</span>Освоили Сибирь, открыли Антарктиду. Многие имена остались на карте.</li>
          <li><span class="d">XX век</span>Наша страна первой запустила искусственный спутник и первой отправила человека в космос.</li>
          <li><span class="d">Сегодня</span>Новейшие компьютеры позволили создать географические информационные системы.</li>
        </ul>
      </section>

      <section><h2>Ответы на вопросы учебника</h2>
        <p class="note">Нажми на вопрос, чтобы открыть ответ. Сначала попробуй ответить сам.</p>
        <div class="qa">
          ${qa("1. Как учёные собирают информацию о Земле?", `
            <p>С помощью <b>искусственных спутников</b> и пилотируемых космических кораблей: они непрерывно наблюдают Землю, фотографируют её, следят за погодой. По космическим снимкам составляют карты. А ещё — в <b>экспедициях, наблюдениях, путешествиях</b>, которые по-прежнему важны.</p>`)}
          ${qa("2. Перечислите источники географической информации. Какова их роль в изучении географии?", `
            <p>Карты и атласы; аэрокосмические снимки; ГИС; поисковые системы Интернета; путешествия и полевые исследования; путеводители; книги, газеты, журналы; справочники и энциклопедии.</p>
            <p><b>Роль:</b> из них мы узнаём о Земле — о странах, природе, городах, людях. Каждый источник даёт своё: карта — где что находится, снимок — как это выглядит сверху, справочник — описание, Интернет — свежие данные. Лучше сравнивать несколько источников.</p>`)}
          ${qa("3. Каково значение космических технологий для развития географической науки?", `
            <p>Спутники позволяют <b>постоянно</b> наблюдать за всей Землёй, составлять точные карты по снимкам, следить за погодой, давать связь и навигацию. Они помогают открывать новое: острова в бухте Визе в Карском море нашли по спутниковым снимкам.</p>`)}
          ${qa("4. Составьте конспект параграфа.", `
            <p class="note">По подсказке на с. 8 конспект содержит главную идею, новые термины и названия, основные мысли.</p>
            <ul><li><b>Главная идея:</b> сегодня информацию о Земле получают из космоса и хранят в компьютерах.</li>
            <li><b>Термины и названия:</b> искусственный спутник Земли, пилотируемый полёт, космические снимки, навигационные системы, источники географической информации, атлас, путеводитель, ГИС; Юрий Гагарин, бухта Визе, Карское море.</li>
            <li><b>Основные мысли:</b> 1) спутники ведут непрерывное наблюдение за Землёй; 2) спутники позволили создать навигационные системы; 3) источников информации много, их нужно сравнивать; 4) ГИС показывают данные на электронных картах.</li></ul>`)}
          ${qa("5. Как наблюдения и исследования в космосе помогают решать земные проблемы?", `
            <p>Спутники наблюдают за погодой — можно заранее предупредить о буре. Обеспечивают связь между странами и континентами. Навигационные системы помогают пилотам, лоцманам и водителям не сбиться с пути. По снимкам составляют карты и исследуют территории — например, открыли новые острова в Карском море.</p>`)}
          ${qa("6. Выпишите географические термины из параграфа.", `
            <p>Искусственный спутник Земли, космический аппарат, пилотируемый полёт, космонавт, космические (спутниковые) снимки, географическая карта, бухта, море, навигационные системы, источники географической информации, атлас, энциклопедия, справочник, путеводитель, маршрут, поисковые системы, экспедиция, ГИС, электронная карта.</p>
            <p class="note">Какие знакомы, а какие встретились впервые — ответь сам. Карта, атлас, экспедиция уже были в прошлых параграфах.</p>`)}
          ${qa("7. Найдите в Интернете информацию по вашему городу, району.", `
            <p>Набери название города в поисковой системе. Посмотри официальный сайт города (там статистика и официальные данные), энциклопедию, карту в сервисе карт. Сравни данные из нескольких источников.</p>`)}
          ${qa("Задание 1 к обобщению: термины и названия из газеты.", `
            <p>Выпиши географические названия и раздели на группы: а) здесь я побывал; б) об этом часто слышал; в) слышу впервые; г) очень хочу побывать; д) здесь живут родные, друзья; е) другое. Вывод: географические знания нужны каждый день — в новостях, поездках, разговорах.</p>`)}
          ${qa("Задание 2 к обобщению: слова Мишеля Песселя.", `
            <p>Французский путешественник ответил: во-первых, на Земле открыто ещё не всё; во-вторых, вы открываете новые земли для себя; и наконец, путешествие — это открытие себя. Своё мнение напиши сам.</p>`)}
          ${qa("Запомните.", `
            <p>Навигационные системы. Источники географической информации. Географические информационные системы (ГИС).</p>`)}
        </div>
      </section>
    </div>
    <div class="row"><button class="btn primary" id="go">К тесту</button></div>`;
  $("#back").onclick = menu; $("#go").onclick = menu;
  window.scrollTo(0,0);
}

document.addEventListener("keydown", e => {
  if (!S) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && !S.res[S.i]) { const b = app.querySelector(`.opt[data-k="${n-1}"]`); if (b) b.click(); }
  else if (e.key === "Enter" && S.res[S.i]) { const nx = $("#next"); if (nx && document.activeElement !== nx) nx.click(); }
});

menu();
</script>
