<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Географические открытия XVII–XX веков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column; menu of blocks -> question card -> results. Progress is a string of beads. */
:root{
  color-scheme:light;
  --bg:#eef4f2; --surface:#ffffff; --ink:#123437; --muted:#55706f; --line:#d3e1dc;
  --accent:#0b6a73; --accent-ink:#ffffff; --good:#2f7d3a; --good-bg:#e5f3e3; --bad:#c03a2b; --bad-bg:#fbe6e2;
  --display:"PT Serif", Georgia, serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f2226; --surface:#173238; --ink:#e3eeea; --muted:#a9c2bf; --line:#2e4d54;
  --accent:#80d4cb; --accent-ink:#0f2226; --good:#6fcf7d; --good-bg:#1e3521; --bad:#ff8a7a; --bad-bg:#43211c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f2226; --surface:#173238; --ink:#e3eeea; --muted:#a9c2bf; --line:#2e4d54;
  --accent:#80d4cb; --accent-ink:#0f2226; --good:#6fcf7d; --good-bg:#1e3521; --bad:#ff8a7a; --bad-bg:#43211c;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.lead{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* timeline strip on the menu */
.eras{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.era{border-top:5px solid var(--accent);padding-top:6px;font-size:.82rem;color:var(--muted);min-width:0}
.era:nth-child(2){opacity:.85} .era:nth-child(3){opacity:.7} .era:nth-child(4){opacity:.55}
.era b{display:block;color:var(--ink);font-size:.92rem}

/* menu */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.block:hover{transform:translateY(-2px);border-color:var(--accent)}
.block .n{font-size:.8rem;font-weight:800;color:var(--accent)}
.block .meta{font-size:.85rem;color:var(--muted);margin-top:auto}
.block.final{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.block.final .n,.block.final .meta{color:var(--accent-ink);opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.home{font-weight:700;color:var(--muted);text-decoration:none;font-size:.92rem}
.home:hover{color:var(--accent)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.beads{display:flex;flex-wrap:wrap;gap:5px}
.bead{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.bead.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bead.ok{background:var(--good);border-color:var(--good)}
.bead.no{background:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qimg{width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#fff}
.qtext{font-size:1.15rem;font-weight:800}
.qhint{color:var(--muted);font-size:.92rem;margin-top:-8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.8rem;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.opt.picked .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb ol{margin:4px 0 0;padding-left:22px}

/* results */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.grade{font-family:var(--display);font-size:3.2rem;font-weight:700;width:92px;height:92px;border-radius:18px;display:grid;place-items:center;color:var(--accent-ink);background:var(--accent)}
.mist{display:flex;flex-direction:column;gap:10px}
.mi{border-left:4px solid var(--bad);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.mi .y{color:var(--bad)} .mi .c{color:var(--good);font-weight:700}
.mthumb{height:80px;width:auto;align-self:flex-start;border-radius:6px;background:#fff;margin-bottom:4px}

/* study */
.study{display:flex;flex-direction:column;gap:28px}
.study section{display:flex;flex-direction:column;gap:10px}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;padding-left:16px}
.tl li::before{content:"";position:absolute;left:-8.5px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl .d{display:block;font-weight:800;color:var(--accent);font-size:.92rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sc img{width:100%;height:150px;object-fit:contain;background:#fff}
.sc .t{padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.sc .t b{font-size:1rem}
.sc .yr{color:var(--muted);font-size:.82rem}
.terms{display:grid;gap:8px;margin:0}
.terms div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.terms dt{display:inline;font-weight:800}
.terms dd{display:inline;margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--surface);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.tbl td:nth-child(2){white-space:nowrap}
.qa{display:flex;flex-direction:column;gap:8px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qa summary{font-weight:800;cursor:pointer}
.qa details > div{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.qa ul,.qa ol{margin:0;padding-left:22px}
.note{color:var(--muted);font-size:.88rem}
@media (max-width:560px){.eras{grid-template-columns:repeat(2,1fr)} .qtext{font-size:1.05rem} .tbl{font-size:.85rem} .tbl th,.tbl td{padding:6px 7px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const plural = (n, one, few, many) => { const t = n % 100, u = n % 10; return t >= 11 && t <= 14 ? many : u === 1 ? one : u >= 2 && u <= 4 ? few : many; };
const KEY = "geo5_discoveries_best";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};

/* ---------- question builders ---------- */
function photoQs(){
  const people = PICS.filter(p => IMG[p.id]).map(p => {
    const same = shuffle(PICS.filter(x => x.id !== p.id && x.g === p.g).map(x => x.name)).slice(0, 2);
    const extra = PIC_EXTRA[p.g][Math.floor(Math.random() * PIC_EXTRA[p.g].length)];
    return { block:"photo", img:p.id, q:"Кто изображён на портрете?", a:p.name, opts: shuffle([p.name, ...same, extra]), e:p.fact };
  });
  const paintings = PAINTINGS.filter(p => IMG[p.id]).map(p => ({ block:"photo", img:p.id, q:p.q, a:p.a, opts: shuffle([p.a, ...p.w]), e:p.e }));
  return [...people, ...paintings];
}
const fromList = (list, block) => list.map(x => ({ block, img:x.img, q:x.q, a:x.a, opts: shuffle([x.a, ...x.w]), e:x.e }));
const orderQs = () => ORDER.map(x => ({ block:"order", type:"order", q:x.q, items:x.items, a:x.items.join(" → "), opts: shuffle(x.items), e:x.e }));

const BLOCKS = {
  photo:{n:"Блок 1", title:"Узнай по картинке", desc:"Портреты путешественников и картины из параграфа.", make:()=>shuffle(photoQs())},
  dates:{n:"Блок 2", title:"Даты", desc:"Годы походов, плаваний и открытий.", make:()=>shuffle(fromList(DATES,"dates"))},
  order:{n:"Блок 3", title:"Лента времени", desc:"Расставь события по порядку.", make:()=>shuffle(orderQs())},
  world:{n:"Блок 4", title:"Зарубежные путешественники", desc:"Дрейк, Баренц, Тасман, Кук, Пири, Амундсен, Хейердал.", make:()=>shuffle(fromList(WORLD,"world"))},
  russia:{n:"Блок 5", title:"Российские путешественники", desc:"Землепроходцы, Лаптевы, Крузенштерн, Беллинсгаузен, полярники.", make:()=>shuffle(fromList(RUSSIA,"russia"))},
  maps:{n:"Блок 6", title:"Имена на карте", desc:"Маршруты, моря, мысы и проливы, названные в честь путешественников.", make:()=>shuffle(fromList(MAPS,"maps"))},
  facts:{n:"Блок 7", title:"Факты и понятия", desc:"Пряности, атласы, корабли, экспедиции.", make:()=>shuffle(fromList(FACTS,"facts"))},
  book:{n:"Блок 8", title:"Вопросы учебника", desc:"Вопросы и выводы из §§ 5–6 учебника 2024 года.", make:()=>shuffle(fromList(BOOK,"book"))},
  final:{n:"Итог", title:"Контрольная проверка", desc:"20 случайных вопросов из всех блоков.", make:()=>shuffle([
    ...shuffle(photoQs()).slice(0,3), ...shuffle(fromList(DATES,"dates")).slice(0,4), ...shuffle(orderQs()).slice(0,1),
    ...shuffle(fromList(WORLD,"world")).slice(0,3), ...shuffle(fromList(RUSSIA,"russia")).slice(0,3),
    ...shuffle(fromList(MAPS,"maps")).slice(0,2), ...shuffle(fromList(FACTS,"facts")).slice(0,2), ...shuffle(fromList(BOOK,"book")).slice(0,2)
  ])}
};

/* ---------- screens ---------- */
let S = null; // quiz state

function menu(){
  S = null;
  const best = store.get() || {};

  };
  app.innerHTML = `
    <a class="home" href="../index.html">← Все тесты</a>
    <header style="display:flex;flex-direction:column;gap:10px">
      <span class="eyebrow">География · 5 класс · § 5</span>
      <h1>Географические открытия XVII–XX веков</h1>
      <p class="lead">Даты, путешественники, имена на карте и ответы на вопросы учебника «Полярная звезда» 2024 года (§ 5 и начало § 6 о российских путешественниках). Выбери блок. После каждого ответа появится подсказка, а в конце — оценка и разбор ошибок.</p>
    </header>
    <div class="eras">
      <div class="era"><b>Землепроходцы и голландцы</b>конец XVI–XVII в.</div>
      <div class="era"><b>Кук и Великая Северная</b>XVIII в.</div>
      <div class="era"><b>Кругосветки и Антарктида</b>XIX в.</div>
      <div class="era"><b>Полюса и Арктика</b>XX в.</div>
    </div>
    <div class="blocks">${["photo","dates","order","world","russia","maps","facts","book"].map(k=>card(k)).join("")}${card("final","final")}</div>
    <div class="row"><button class="btn" id="study">Повторить материал перед тестом</button></div>`;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => start(b.dataset.go));

function start(key, list){
  S = { key, qs: list || BLOCKS[key].make(), i:0, res:[], pick:[] };
  render();
}

function render(){
  const q = S.qs[S.i];
  S.pick = [];
  const beads = S.qs.map((_,k)=>{
    const r = S.res[k]; return `<span class="bead ${r===undefined ? (k===S.i?"cur":"") : (r.ok?"ok":"no")}"></span>`;
  }).join("");
  const img = q.img && IMG[q.img] ? `<img class="qimg" src="${IMG[q.img]}" alt="">` : "";
  const hint = q.type==="order" ? `<p class="qhint">Нажимай варианты по порядку. Нажмёшь ещё раз — отменишь выбор.</p>` : "";
  app.innerHTML = `
    <div class="qtop"><button class="btn ghost" id="back">← Меню</button><span class="eyebrow">${BLOCKS[S.key].title} · ${S.i+1} из ${S.qs.length}</span></div>
    <div class="beads" aria-hidden="true">${beads}</div>
    <div class="card">
      ${img}
      <p class="qtext">${esc(q.q)}</p>${hint}
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${q.type==="order"?"":k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>`;
  $("#back").onclick = menu;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => q.type==="order" ? pickOrder(+b.dataset.k) : answer(+b.dataset.k));
  window.scrollTo(0,0);
}

function pickOrder(k){
  if (S.res[S.i]) return;
  const q = S.qs[S.i]; const at = S.pick.indexOf(k);
  if (at >= 0) S.pick = S.pick.slice(0, at); else S.pick.push(k);
  app.querySelectorAll(".opt").forEach((b,j)=>{
    const n = S.pick.indexOf(j);
    b.classList.toggle("picked", n >= 0);
    b.querySelector(".k").textContent = n >= 0 ? n+1 : "";
  });
  $("#fb").innerHTML = S.pick.length === q.opts.length
    ? `<div class="row"><button class="btn primary" id="check">Проверить</button></div>` : "";
  if ($("#check")) { $("#check").onclick = checkOrder; $("#check").focus({preventScroll:true}); }
}

function checkOrder(){
  const q = S.qs[S.i]; const seq = S.pick.map(k => q.opts[k]);
  const ok = seq.join("|") === q.items.join("|");
  S.res[S.i] = { ok, pick: seq.join(" → ") };
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    b.classList.remove("picked");
    b.classList.add(q.items.indexOf(q.opts[j]) === S.pick.indexOf(j) ? "right" : "wrong");
  });
  const list = ok ? "" : `<ol>${q.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  feedback(ok, ok ? "Верно!" : "Порядок неверный. Правильно так:", list + `<span>${esc(q.e)}</span>`);
}

function answer(k){
  if (S.res[S.i]) return;
  const q = S.qs[S.i]; const pick = q.opts[k]; const ok = pick === q.a;
  S.res[S.i] = { ok, pick };
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if (q.opts[j] === q.a) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  feedback(ok, ok ? "Верно!" : "Неверно. Правильный ответ: " + esc(q.a), `<span>${esc(q.e)}</span>`);
}

function feedback(ok, head, body){
  const bead = app.querySelectorAll(".bead")[S.i]; bead.className = "bead " + (ok?"ok":"no");
  const last = S.i === S.qs.length - 1;
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${head}</b>${body}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${last?"Показать результат":"Дальше →"}</button></div>`;
  $("#next").onclick = () => { if (last) results(); else { S.i++; render(); } };
  $("#next").focus({preventScroll:true});
}

function grade(p){ return p>=90?5 : p>=70?4 : p>=50?3 : 2; }

function results(){
  const right = S.res.filter(r=>r.ok).length, total = S.qs.length, p = Math.round(right/total*100);
  const g = grade(p);
  if (!S.retry){ const best = store.get() || {}; if (!best[S.key] || p > best[S.key]) { best[S.key] = p; store.set(best); } }
  const wrong = S.qs.map((q,k)=>({q, r:S.res[k]})).filter(x=>!x.r.ok);
  const words = {5:"Отлично!",4:"Хорошо!",3:"Неплохо, но стоит повторить.",2:"Нужно ещё раз повторить параграф."};
  app.innerHTML = `
    <div class="qtop"><button class="btn ghost" id="back">← Меню</button><span class="eyebrow">${BLOCKS[S.key].title}${S.retry?" · работа над ошибками":""}</span></div>
    <div class="card">
      <div class="score"><div class="grade">${g}</div>
        <div style="display:flex;flex-direction:column;gap:4px"><h2>${words[g]}</h2><p>Правильно ${right} из ${total} (${p}%)</p>
        <p class="lead" style="font-size:.85rem">Оценка: 90% и больше — «5», 70% — «4», 50% — «3».</p></div></div>
      <div class="row">
        ${wrong.length?`<button class="btn primary" id="fix">Исправить ошибки (${wrong.length})</button>`:""}
        <button class="btn" id="again">Пройти заново</button>
        <button class="btn ghost" id="study2">Повторить материал</button>
      </div>
    </div>
    ${wrong.length?`<div class="card"><h2>Разбор ошибок</h2><div class="mist">${wrong.map(x=>`
      <div class="mi">${x.q.img&&IMG[x.q.img]?`<img class="mthumb" src="${IMG[x.q.img]}" alt="">`:""}<span>${esc(x.q.q)}</span><span class="y">Ответ: ${esc(x.r.pick)}</span><span class="c">Правильно: ${esc(x.q.a)}</span></div>`).join("")}</div></div>`:""}`;
  $("#back").onclick = menu;
  $("#study2").onclick = study;
  $("#again").onclick = () => start(S.key);
  if (wrong.length) $("#fix").onclick = () => {
    const key = S.key;
    const qs = shuffle(wrong.map(x => ({...x.q, opts: shuffle(x.q.opts)})));
    start(key, qs); S.retry = true;
  };
  window.scrollTo(0,0);
}

      <section><h2>Имена на карте</h2>
        <dl class="terms">
          <div><dt>Пролив Дрейка</dt> <dd>— между Южной Америкой (Огненной Землёй) и Антарктидой.</dd></div>
          <div><dt>Баренцево море</dt> <dd>— в Северном Ледовитом океане, названо по предложению Русского географического общества.</dd></div>
          <div><dt>Остров Тасмания</dt> <dd>— к югу от Австралии, назван в честь Абеля Тасмана.</dd></div>
          <div><dt>Ботанический залив</dt> <dd>— в Австралии: экспедиция Кука нашла там много новых растений.</dd></div>
          <div><dt>Мыс Дежнёва</dt> <dd>— самая восточная точка Евразии.</dd></div>
          <div><dt>Берингов пролив</dt> <dd>— между Азией и Америкой.</dd></div>
          <div><dt>Море Лаптевых</dt> <dd>— в Северном Ледовитом океане, в честь Харитона и Дмитрия Лаптевых.</dd></div>
          <div><dt>Мыс Челюскин</dt> <dd>— самая северная точка Евразии, на Таймыре.</dd></div>
          <div><dt>Остров Врангеля</dt> <dd>— в Северном Ледовитом океане.</dd></div>
          <div><dt>Хребет Черского</dt> <dd>— горы в Якутии, нанесены на карту С. В. Обручевым и К. А. Салищевым в 1926–1931 годах.</dd></div>
          <div><dt>Хребет Ломоносова</dt> <dd>— подводный хребет на дне Северного Ледовитого океана.</dd></div>
          <div><dt>Охотск</dt> <dd>— первый русский порт и старейший из нынешних русских городов на Тихом океане.</dd></div>
        </dl>
      </section>

      <section><h2>Понятия</h2>
        <dl class="terms">
          <div><dt>Пряности</dt> <dd>— перец, гвоздика, ваниль, корица, мускат. Самый прибыльный товар, ради него искали морские пути.</dd></div>
          <div><dt>Атлас</dt> <dd>— набор карт по странам мира.</dd></div>
          <div><dt>Terra Australis Incognita</dt> <dd>— «Неведомая Южная Земля»: так на старых картах обозначали неоткрытый южный материк.</dd></div>
          <div><dt>Землепроходцы</dt> <dd>— русские люди, которые открывали и присоединяли к России земли Сибири и Дальнего Востока.</dd></div>
          <div><dt>Великая Северная экспедиция</dt> <dd>— с 1733 года исследовала северное побережье России от Печоры до Камчатки и внутренние районы Сибири.</dd></div>
          <div><dt>Русское географическое общество</dt> <dd>— основано в 1845 году, организует экспедиции по стране и за её пределами.</dd></div>
          <div><dt>Шлюп</dt> <dd>— военный парусный корабль. «Восток» и «Мирный» — шлюпы экспедиции, открывшей Антарктиду.</dd></div>
          <div><dt>Северный морской путь</dt> <dd>— путь вдоль северных берегов России из Европы к Тихому океану.</dd></div>
          <div><dt>Навигация</dt> <dd>— время года, когда по морю можно плавать (нет сплошного льда).</dd></div>
          <div><dt>Дрейфующая станция</dt> <dd>— научная станция на льдине, которая плывёт вместе со льдом.</dd></div>
        </dl>
      </section>

      <section><h2>Ответы на вопросы учебника</h2>
        <p class="note">Нажми на вопрос, чтобы открыть ответ. Сначала попробуй ответить сам.</p>
        <div class="qa">
          ${qa("§ 5. Как были открыты и исследованы все материки?", `
            <p>Европейцы искали морские пути к пряностям, золоту и серебру. В конце XVI — XVII веке первыми на море были голландцы: Баренц исследовал северные моря, Тасман — Австралию и Новую Зеландию. В XVIII веке первенство перешло к Англии — Кук совершил три кругосветных плавания. Последний материк — Антарктиду — в 1820 году открыла русская экспедиция Беллинсгаузена и Лазарева.</p>
            <p><b>Вывод:</b> в XVII веке открыта Австралия, в XIX — Антарктида.</p>`)}
          ${qa("§ 5. Когда на Земле не осталось неоткрытых мест?", `
            <p>В XIX веке оставались неизученными многие внутренние области материков и северные морские пути. Гумбольдт путешествовал по Южной Америке, Ливингстон исследовал Африку (водопад Виктория), Пржевальский — Центральную Азию (1871–1886). Норденшельд открыл Северо-восточный проход (1878–1879), Амундсен — Северо-западный (1903–1906).</p>
            <p>Пири в 1909 году побывал около Северного полюса, Амундсен в 1911 году — на Южном полюсе, а в 1926 году пролетел над Северным на дирижабле «Норвегия». Первыми на Северном полюсе на уровне моря были участники советской экспедиции «Север-2» (1948). Последнее крупное открытие на суше — хребет Черского (1926–1931).</p>
            <p>В XX веке продолжили изучать океаны, внутренние районы материков и полярные области.</p>`)}
          ${qa("§ 5, вопрос 1. Найдите на картах Приложения пролив Дрейка, Баренцево море, Австралию, Новую Зеландию.", `
            <ul><li><b>Пролив Дрейка</b> — между Южной Америкой и Антарктидой.</li>
            <li><b>Баренцево море</b> — в Северном Ледовитом океане у северных берегов Европы (Россия и Норвегия).</li>
            <li><b>Австралия</b> — материк в Южном полушарии между Индийским и Тихим океанами.</li>
            <li><b>Новая Зеландия</b> — острова в Тихом океане к юго-востоку от Австралии.</li></ul>`)}
          ${qa("§ 5, вопрос 2. Какие материки были известны европейцам до начала Великих географических открытий?", `
            <p><b>Евразия</b> (Европа и Азия) и <b>Африка</b>. Америку открыли во время Великих географических открытий, Австралию — в XVII веке, Антарктиду — в 1820 году.</p>`)}
          ${qa("§ 5, вопрос 3. Кто и когда открыл Австралию?", `
            <p>Голландские моряки подходили к берегам Австралии <b>в XVII веке</b>: Абель Тасман в 1642–1644 годах открыл Тасманию, Новую Зеландию, Фиджи и Тонга. Но свои маршруты голландцы больше ста лет держали в секрете. Поэтому открытие Австралии чаще всего связывают с <b>Джеймсом Куком</b>: в 1770 году он объявил её восточное побережье британским владением, и с его экспедиций началось освоение материка.</p>
            <p><b>Вывод учебника:</b> в XVII веке была открыта Австралия.</p>`)}
          ${qa("§ 5, вопрос 4. Заполните таблицу о путешественниках.", `
            <p>Смотри таблицу выше: Дрейк, Баренц, Тасман, Кук, Норденшельд, Пири, Амундсен. Последнюю колонку («чем интересен лично вам») заполни сам — например: Хейердал смелый, потому что поплыл через океан на плоту.</p>`)}
          ${qa("§ 5, вопрос 5. Опишите картину «Географ» (рис. 15).", `
            <p>Учёный стоит у стола у окна, в руке у него циркуль, перед ним — карта, на шкафу — глобус. Он получает сведения из рассказов и записей мореплавателей и их карт. Он мечтает узнать, что лежит на юге, — ведь Австралия и Антарктида ещё не открыты. Ему известны Европа, Азия, Африка и Америка.</p>
            <p class="note">Это творческое задание — рассказ можно придумать свой.</p>`)}
          ${qa("§ 6. Какова роль русских землепроходцев в освоении Сибири и Дальнего Востока?", `
            <p>За 58 лет — от похода Ермака (1581) до выхода Москвитина к Охотскому морю (1639) — землепроходцы дошли от Урала до Тихого океана. Дежнёв (1648) прошёл проливом между Азией и Америкой, Поярков и Хабаров вышли на Амур. Они не только открывали земли, но и присоединяли их к России.</p>
            <p><b>Вывод:</b> землепроходцы внесли огромный вклад в расширение территории России и умножение её богатств (тогда — меха, сейчас — нефть, газ, уголь, лес).</p>`)}
          ${qa("§ 6. Как шло географическое изучение территории России?", `
            <p>Нужно было составить точные карты, описать богатства и народы. Для этого: Великая Северная экспедиция (с 1733 года), географический департамент Академии наук (Ломоносов), с 1845 года — Русское географическое общество. Экспедиции шли вдоль побережий северных морей, в Сибирь, Центральную Азию и на Дальний Восток.</p>`)}
          ${qa("§ 6. Какие исследования проводили россияне в Мировом океане?", `
            <p>Шелехов ходил к Алеутским островам и Аляске (конец XVIII века). Крузенштерн и Лисянский совершили первое русское кругосветное плавание (1803–1806). Беллинсгаузен и Лазарев открыли Антарктиду (1820). В XX веке изучали Арктику: «Сибиряков» (1932), «Северный полюс-1» (1937–1938), «Арктика-2007».</p>`)}
          ${qa("§ 6, вопрос 1. Найдите на карте крайние точки Евразии, открытые русскими путешественниками.", `
            <p>Северная — <b>мыс Челюскин</b> (полуостров Таймыр). Восточная — <b>мыс Дежнёва</b> (Чукотка, у Берингова пролива).</p>`)}
          ${qa("§ 6, вопрос 2. По карте на с. 184–185 проследите маршрут первого русского кругосветного плавания.", `
            <ol><li>Из Кронштадта (у Санкт-Петербурга) через Атлантический океан с севера на юг.</li>
            <li>Через пролив Дрейка — в Тихий океан, по пути открыли несколько островов.</li>
            <li>Камчатка и Аляска.</li>
            <li>Обратно: обогнули Азию с юга, пересекли Индийский океан.</li>
            <li>Обогнули Африку, пересекли Атлантику с юга на север и вернулись в Санкт-Петербург.</li></ol>
            <p class="note">Про Кронштадт в тексте не сказано — отплывали оттуда.</p>`)}
          ${qa("§ 6, вопрос 3. Какие территории изучали участники Великой Северной экспедиции?", `
            <p>Всё <b>северное побережье России от устья Печоры до Камчатки</b> и <b>внутренние районы Сибири</b>. Память о них — море Лаптевых и мыс Челюскин.</p>`)}
          ${qa("§ 6, вопрос 4. Как назывались корабли первого русского кругосветного плавания?", `
            <p><b>«Надежда»</b> и <b>«Нева»</b>. Не путай со шлюпами <b>«Восток»</b> и <b>«Мирный»</b> — на них открыли Антарктиду.</p>`)}
          ${qa("§ 6, вопрос 5. Заполните таблицу о русских путешественниках.", `
            <p>Смотри таблицу выше: от Ермака до Беллинсгаузена и Лазарева. Подробнее — в тесте по § 6.</p>`)}
          ${qa("§ 6, вопросы 6–7. История своей местности; качества первооткрывателей.", `
            <p>Это вопросы для собственного рассказа. Качества первооткрывателей: смелость, выносливость, упорство, любознательность, умение работать в команде, ответственность за товарищей. Развивать стоит любознательность, упорство и умение доводить дело до конца.</p>`)}
        </div>
      </section>
    </div>
    <div class="row"><button class="btn primary" id="go">К тесту</button></div>`;
  $("#back").onclick = menu; $("#go").onclick = menu;
  window.scrollTo(0,0);
}

document.addEventListener("keydown", e => {
  if (!S) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && !S.res[S.i]) { const b = app.querySelector(`.opt[data-k="${n-1}"]`); if (b) b.click(); }
  else if (e.key === "Enter" && S.res[S.i]) { const nx = $("#next"); if (nx && document.activeElement !== nx) nx.click(); }
});

menu();
</script>
