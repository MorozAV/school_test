<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Религия и культура Индии и Китая</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column; menu of blocks -> question card -> results. Progress is a string of beads. */
:root{
  color-scheme:light;
  --bg:#f4f0e6; --surface:#fffdf8; --ink:#1f2433; --muted:#626a7a; --line:#dfd8c8;
  --accent:#2c5a8c; --accent-ink:#ffffff; --good:#2f7d3a; --good-bg:#e5f3e3; --bad:#c03a2b; --bad-bg:#fbe6e2;
  --display:"PT Serif", Georgia, serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171f; --surface:#1d2330; --ink:#e9ecf2; --muted:#a3acbd; --line:#323b4d;
  --accent:#8db8ea; --accent-ink:#13171f; --good:#6fcf7d; --good-bg:#1e3521; --bad:#ff8a7a; --bad-bg:#43211c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171f; --surface:#1d2330; --ink:#e9ecf2; --muted:#a3acbd; --line:#323b4d;
  --accent:#8db8ea; --accent-ink:#13171f; --good:#6fcf7d; --good-bg:#1e3521; --bad:#ff8a7a; --bad-bg:#43211c;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.lead{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* timeline strip on the menu */
.eras{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.era{border-top:5px solid var(--accent);padding-top:6px;font-size:.82rem;color:var(--muted);min-width:0}
.era:nth-child(2){opacity:.85} .era:nth-child(3){opacity:.7} .era:nth-child(4){opacity:.55}
.era b{display:block;color:var(--ink);font-size:.92rem}

/* menu */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.block:hover{transform:translateY(-2px);border-color:var(--accent)}
.block .n{font-size:.8rem;font-weight:800;color:var(--accent)}
.block .meta{font-size:.85rem;color:var(--muted);margin-top:auto}
.block.final{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.block.final .n,.block.final .meta{color:var(--accent-ink);opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.home{font-weight:700;color:var(--muted);text-decoration:none;font-size:.92rem}
.home:hover{color:var(--accent)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.beads{display:flex;flex-wrap:wrap;gap:5px}
.bead{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.bead.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bead.ok{background:var(--good);border-color:var(--good)}
.bead.no{background:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qimg{width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#fff}
.qtext{font-size:1.15rem;font-weight:800}
.qhint{color:var(--muted);font-size:.92rem;margin-top:-8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.8rem;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.opt.picked .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb ol{margin:4px 0 0;padding-left:22px}

/* results */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.grade{font-family:var(--display);font-size:3.2rem;font-weight:700;width:92px;height:92px;border-radius:18px;display:grid;place-items:center;color:var(--accent-ink);background:var(--accent)}
.mist{display:flex;flex-direction:column;gap:10px}
.mi{border-left:4px solid var(--bad);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.mi .y{color:var(--bad)} .mi .c{color:var(--good);font-weight:700}
.mthumb{height:80px;width:auto;align-self:flex-start;border-radius:6px;background:#fff;margin-bottom:4px}

/* study */
.study{display:flex;flex-direction:column;gap:28px}
.study section{display:flex;flex-direction:column;gap:10px}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;padding-left:16px}
.tl li::before{content:"";position:absolute;left:-8.5px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl .d{display:block;font-weight:800;color:var(--accent);font-size:.92rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sc img{width:100%;height:150px;object-fit:contain;background:#fff}
.sc .t{padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.sc .t b{font-size:1rem}
.sc .yr{color:var(--muted);font-size:.82rem}
.terms{display:grid;gap:8px;margin:0}
.terms div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.terms dt{display:inline;font-weight:800}
.terms dd{display:inline;margin:0}
.qa{display:flex;flex-direction:column;gap:8px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qa summary{font-weight:800;cursor:pointer}
.qa details > div{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.qa ul,.qa ol{margin:0;padding-left:22px}
.note{color:var(--muted);font-size:.88rem}
@media (max-width:560px){.eras{grid-template-columns:repeat(2,1fr)} .qtext{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- screens ---------- */
let S = null; // quiz state

function menu(){
  S = null;
  const best = store.get() || {};
  const card = (k, cls="") => {

    return `<button class="block ${cls}" data-go="${k}"><span class="n">${b.n}</span><h3>${b.title}</h3><span>${b.desc}</span><span class="meta">${count} ${unit}${r}</span></button>`;
  };
  app.innerHTML = `
    <a class="home" href="../index.html">← Все тесты</a>
    <header style="display:flex;flex-direction:column;gap:10px">
      <span class="eyebrow">История Древнего мира · 5 класс · § 19</span>
      <h1>Религия и культура Древней Индии и Древнего Китая</h1>
      <p class="lead">Индуизм и буддизм, Конфуций, открытия индийцев и китайцев, вопросы учебника и итоги главы II. Выбери блок. После каждого ответа появится подсказка, а в конце — оценка и разбор ошибок.</p>
    </header>
    <div class="eras">
      <div class="era"><b>Лак</b>XIII в. до н. э.</div>
      <div class="era"><b>Будда</b>VI в. до н. э.</div>
      <div class="era"><b>Конфуций</b>около 500 г. до н. э.</div>
      <div class="era"><b>Бумага</b>I в. до н. э.</div>
    </div>
    <div class="blocks">${["photo","dates","order","india","culture","china","invent","book","chapter"].map(k=>card(k)).join("")}${card("final","final")}</div>
    <div class="row"><button class="btn" id="study">Повторить материал перед тестом</button></div>`;

function start(key, list){
  S = { key, qs: list || BLOCKS[key].make(), i:0, res:[], pick:[] };
  render();
}

function render(){
  const q = S.qs[S.i];
  S.pick = [];
  const beads = S.qs.map((_,k)=>{
    const r = S.res[k]; return `<span class="bead ${r===undefined ? (k===S.i?"cur":"") : (r.ok?"ok":"no")}"></span>`;
  }).join("");
  const img = q.img && IMG[q.img] ? `<img class="qimg" src="${IMG[q.img]}" alt="">` : "";
  const hint = q.type==="order" ? `<p class="qhint">Нажимай варианты по порядку. Нажмёшь ещё раз — отменишь выбор.</p>` : "";
  app.innerHTML = `
    <div class="qtop"><button class="btn ghost" id="back">← Меню</button><span class="eyebrow">${BLOCKS[S.key].title} · ${S.i+1} из ${S.qs.length}</span></div>
    <div class="beads" aria-hidden="true">${beads}</div>
    <div class="card">
      ${img}
      <p class="qtext">${esc(q.q)}</p>${hint}
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${q.type==="order"?"":k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>`;
  $("#back").onclick = menu;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => q.type==="order" ? pickOrder(+b.dataset.k) : answer(+b.dataset.k));
  window.scrollTo(0,0);
}

function pickOrder(k){
  if (S.res[S.i]) return;
  const q = S.qs[S.i]; const at = S.pick.indexOf(k);
  if (at >= 0) S.pick = S.pick.slice(0, at); else S.pick.push(k);
  app.querySelectorAll(".opt").forEach((b,j)=>{
    const n = S.pick.indexOf(j);
    b.classList.toggle("picked", n >= 0);
    b.querySelector(".k").textContent = n >= 0 ? n+1 : "";
  });
  $("#fb").innerHTML = S.pick.length === q.opts.length
    ? `<div class="row"><button class="btn primary" id="check">Проверить</button></div>` : "";
  if ($("#check")) { $("#check").onclick = checkOrder; $("#check").focus({preventScroll:true}); }
}

function checkOrder(){
  const q = S.qs[S.i]; const seq = S.pick.map(k => q.opts[k]);
  const ok = seq.join("|") === q.items.join("|");
  S.res[S.i] = { ok, pick: seq.join(" → ") };
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    b.classList.remove("picked");
    b.classList.add(q.items.indexOf(q.opts[j]) === S.pick.indexOf(j) ? "right" : "wrong");
  });
  const list = ok ? "" : `<ol>${q.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  feedback(ok, ok ? "Верно!" : "Порядок неверный. Правильно так:", list + `<span>${esc(q.e)}</span>`);
}

function answer(k){
  if (S.res[S.i]) return;
  const q = S.qs[S.i]; const pick = q.opts[k]; const ok = pick === q.a;
  S.res[S.i] = { ok, pick };
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if (q.opts[j] === q.a) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  feedback(ok, ok ? "Верно!" : "Неверно. Правильный ответ: " + esc(q.a), `<span>${esc(q.e)}</span>`);
}

function feedback(ok, head, body){
  const bead = app.querySelectorAll(".bead")[S.i]; bead.className = "bead " + (ok?"ok":"no");
  const last = S.i === S.qs.length - 1;
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${head}</b>${body}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${last?"Показать результат":"Дальше →"}</button></div>`;
  $("#next").onclick = () => { if (last) results(); else { S.i++; render(); } };
  $("#next").focus({preventScroll:true});
}

function grade(p){ return p>=90?5 : p>=70?4 : p>=50?3 : 2; }

function results(){
  const right = S.res.filter(r=>r.ok).length, total = S.qs.length, p = Math.round(right/total*100);
  const g = grade(p);
  if (!S.retry){ const best = store.get() || {}; if (!best[S.key] || p > best[S.key]) { best[S.key] = p; store.set(best); } }
  const wrong = S.qs.map((q,k)=>({q, r:S.res[k]})).filter(x=>!x.r.ok);
  const words = {5:"Отлично!",4:"Хорошо!",3:"Неплохо, но стоит повторить.",2:"Нужно ещё раз повторить параграф."};
  app.innerHTML = `
    <div class="qtop"><button class="btn ghost" id="back">← Меню</button><span class="eyebrow">${BLOCKS[S.key].title}${S.retry?" · работа над ошибками":""}</span></div>
    <div class="card">
      <div class="score"><div class="grade">${g}</div>
        <div style="display:flex;flex-direction:column;gap:4px"><h2>${words[g]}</h2><p>Правильно ${right} из ${total} (${p}%)</p>
        <p class="lead" style="font-size:.85rem">Оценка: 90% и больше — «5», 70% — «4», 50% — «3».</p></div></div>
      <div class="row">
        ${wrong.length?`<button class="btn primary" id="fix">Исправить ошибки (${wrong.length})</button>`:""}
        <button class="btn" id="again">Пройти заново</button>
        <button class="btn ghost" id="study2">Повторить материал</button>
      </div>
    </div>
    ${wrong.length?`<div class="card"><h2>Разбор ошибок</h2><div class="mist">${wrong.map(x=>`
      <div class="mi">${x.q.img&&IMG[x.q.img]?`<img class="mthumb" src="${IMG[x.q.img]}" alt="">`:""}<span>${esc(x.q.q)}</span><span class="y">Ответ: ${esc(x.r.pick)}</span><span class="c">Правильно: ${esc(x.q.a)}</span></div>`).join("")}</div></div>`:""}`;
  $("#back").onclick = menu;
  $("#study2").onclick = study;
  $("#again").onclick = () => start(S.key);
  if (wrong.length) $("#fix").onclick = () => {
    const key = S.key;
    const qs = shuffle(wrong.map(x => ({...x.q, opts: x.q.fixed ? x.q.opts : shuffle(x.q.opts)})));
    start(key, qs); S.retry = true;
  };
  window.scrollTo(0,0);
}

            <p><b>Цифры</b> («арабские»), <b>ноль</b> и запись чисел, где значение цифры зависит от её места. А ещё <b>шахматы</b> — «чатуранга».</p>`)}
          ${qa("Почему символы инь и ян образуют круг?", `
            <p>Все вещи — <b>неразделимые</b> противоположности: светлое и тёмное, мужское и женское, старое и молодое. Одно не бывает без другого, вместе они составляют целое — круг.</p>`)}
          ${qa("На чём основывалось учение Конфуция?", `
            <p>На оценке поведения человека и его поступков. В основе — идея о <b>совершенном человеке</b> (скромность, справедливость, исполнение долга) и о государстве как <b>большой семье</b> со строгим порядком. Пять добродетелей: мудрость, гуманность, верность, почитание старших, мужество. Одно из главных положений — культ предков.</p>`)}
          ${qa("Какие открытия и достижения были сделаны в Древнем Китае?", `
            <p>Акупунктура, лак, порох, бумага, шёлк, компас, десятичные дроби, предсказание солнечных и лунных затмений. Ещё был проложен Великий шёлковый путь.</p>`)}
          ${qa("1. Сравните индуизм с верой египтян. Что у них общего и чем они различались?", `
            <p><b>Общее:</b> много богов, у каждого свои обязанности; есть боги с головами животных (Ганеша — с головой слона); важную роль играли жрецы.</p>
            <p><b>Различие:</b> египтяне верили в загробную жизнь и суд над душой, а в индуизме душа <b>перерождается</b> в новом теле (сансара), и судьба зависит от прошлой жизни.</p>`)}
          ${qa("2. Почему китайские императоры поддерживали учение Конфуция?", `
            <p>Конфуций учил строгому порядку, <b>верности государю</b> и почитанию старших: «государь — государем, чиновник — чиновником». Государство — большая семья, где каждый на своём месте. Такое учение укрепляло власть императора.</p>`)}
          ${qa("3. Подумайте, почему буддизм смог так широко распространиться в Индии.", `
            <p>Будда учил, что избавиться от страданий может <b>каждый</b>, кто откажется от желаний, — не важно, богат он или беден и к какой варне принадлежит. Ученики строили монастыри и продолжали проповедь, а в государстве возводили храмы Будде.</p>`)}
          ${qa("4. Почему древние китайцы смогли создать бумагу и компас?", `
            <p>Они внимательно <b>наблюдали природу</b> и копили опыт мастеров: знали, что магнетит намагничивается, умели обрабатывать растения и волокна. Учёных и мастеров ценили, а секреты передавали из поколения в поколение. Нужна была и дешёвая замена бамбуковым дощечкам и шёлку.</p>`)}
          ${qa("Работаем с понятиями: буддизм, шёлк, порох, пагода. Какое понятие общее?", `
            <p>Всё это — <b>культура Древнего Китая</b>: шёлк и порох изобрели китайцы, пагода — китайский буддийский храм, буддизм проник в Китай из Индии.</p>`)}
          ${qa("Итоги главы: какое из чудес света Древнего Востока существует в наше время?", `
            <p><b>Египетские пирамиды</b> — единственное из семи чудес света, сохранившееся до наших дней. Висячие сады Вавилона не сохранились.</p>`)}
          ${qa("Итоги главы: работаем с источником — надпись из храма в Фивах и законы о плотине и арыке", `
            <p><b>Надпись:</b> перечень добычи египетского войска после битвы при Мегиддо. Фивы — город в Египте, войско возглавлял фараон (Тутмос III).</p>
            <p><b>Законы:</b> это законы вавилонского царя <b>Хаммурапи</b>. Они защищали земледельцев, хозяев садов, владельцев судов и грузов: виновный возмещал убытки.</p>`)}
        </div>
      </section>
    </div>
    <div class="row"><button class="btn primary" id="go">К тесту</button></div>`;
  $("#back").onclick = menu; $("#go").onclick = menu;
  window.scrollTo(0,0);
}

document.addEventListener("keydown", e => {
  if (!S) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && !S.res[S.i]) { const b = app.querySelector(`.opt[data-k="${n-1}"]`); if (b) b.click(); }
  else if (e.key === "Enter" && S.res[S.i]) { const nx = $("#next"); if (nx && document.activeElement !== nx) nx.click(); }
});

menu();
</script>
</body>
</html>
