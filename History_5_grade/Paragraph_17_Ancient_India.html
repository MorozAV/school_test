<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Древняя Индия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one narrow column; menu of blocks -> question card -> results. Progress is a string of beads. */
:root{
  color-scheme:light;
  --bg:#f6f0e6; --surface:#fffdf8; --ink:#33200f; --muted:#7a6350; --line:#e6d8c4;
  --accent:#b4521c; --accent-ink:#ffffff; --good:#2f7d3a; --good-bg:#e5f3e3; --bad:#c03a2b; --bad-bg:#fbe6e2;
  --v1:#2a7f8f; --v2:#c03a2b; --v3:#b07d0c; --v4:#5f6470;
  --display:"PT Serif", Georgia, serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c140e; --surface:#2a1f16; --ink:#f3e7d8; --muted:#c3ab92; --line:#46362a;
  --accent:#f0a067; --accent-ink:#1c140e; --good:#6fcf7d; --good-bg:#1e3521; --bad:#ff8a7a; --bad-bg:#43211c;
  --v1:#5cc3d3; --v2:#ff8a7a; --v3:#e8b84a; --v4:#aab0bd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c140e; --surface:#2a1f16; --ink:#f3e7d8; --muted:#c3ab92; --line:#46362a;
  --accent:#f0a067; --accent-ink:#1c140e; --good:#6fcf7d; --good-bg:#1e3521; --bad:#ff8a7a; --bad-bg:#43211c;
  --v1:#5cc3d3; --v2:#ff8a7a; --v3:#e8b84a; --v4:#aab0bd; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
img{max-width:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.lead{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* timeline strip on the menu */
.eras{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.era{border-top:5px solid var(--accent);padding-top:6px;font-size:.82rem;color:var(--muted);min-width:0}
.era:nth-child(2){opacity:.85} .era:nth-child(3){opacity:.7} .era:nth-child(4){opacity:.55}
.era b{display:block;color:var(--ink);font-size:.92rem}

/* menu */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.block:hover{transform:translateY(-2px);border-color:var(--accent)}
.block .n{font-size:.8rem;font-weight:800;color:var(--accent)}
.block .meta{font-size:.85rem;color:var(--muted);margin-top:auto}
.block.final{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.block.final .n,.block.final .meta{color:var(--accent-ink);opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.home{font-weight:700;color:var(--muted);text-decoration:none;font-size:.92rem}
.home:hover{color:var(--accent)}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.beads{display:flex;flex-wrap:wrap;gap:5px}
.bead{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface)}
.bead.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bead.ok{background:var(--good);border-color:var(--good)}
.bead.no{background:var(--bad);border-color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qimg{width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#fff}
.qtext{font-size:1.15rem;font-weight:800}
.qhint{color:var(--muted);font-size:.92rem;margin-top:-8px}
.chip{display:inline-block;font-size:.78rem;font-weight:800;padding:2px 10px;border-radius:999px;color:var(--c);border:1.5px solid var(--c)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:700}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.8rem;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.opt.picked .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.55}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb ol{margin:4px 0 0;padding-left:22px}

/* results */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.grade{font-family:var(--display);font-size:3.2rem;font-weight:700;width:92px;height:92px;border-radius:18px;display:grid;place-items:center;color:var(--accent-ink);background:var(--accent)}
.mist{display:flex;flex-direction:column;gap:10px}
.mi{border-left:4px solid var(--bad);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.mi .y{color:var(--bad)} .mi .c{color:var(--good);font-weight:700}
.mthumb{height:80px;width:auto;align-self:flex-start;border-radius:6px;background:#fff;margin-bottom:4px}

/* study */
.study{display:flex;flex-direction:column;gap:28px}
.study section{display:flex;flex-direction:column;gap:10px}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;padding-left:16px}
.tl li::before{content:"";position:absolute;left:-8.5px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl .d{display:block;font-weight:800;color:var(--accent);font-size:.92rem}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sc img{width:100%;height:150px;object-fit:contain;background:#fff}
.sc .t{padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.sc .t b{font-size:1rem}
.sc .yr{color:var(--muted);font-size:.82rem}
.terms{display:grid;gap:8px;margin:0}
.terms div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.terms dt{display:inline;font-weight:800}
.terms dd{display:inline;margin:0}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.vc{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.88rem;min-width:0}
.vc img{height:150px;object-fit:contain;background:#fff;border-radius:8px}
.vc b{font-size:1rem;color:var(--c)}
.qa{display:flex;flex-direction:column;gap:8px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.qa summary{font-weight:800;cursor:pointer}
.qa details > div{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.qa ul,.qa ol{margin:0;padding-left:22px}
.note{color:var(--muted);font-size:.88rem}
@media (max-width:560px){.vgrid{grid-template-columns:repeat(2,1fr)} .eras{grid-template-columns:repeat(2,1fr)} .qtext{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const KEY = "india17_best";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
const varnaNames = [1,2,3,4].map(v => VARNAS[v].name);
const varnaChip = v => `<span class="chip" style="--c:${VARNAS[v].c}">${VARNAS[v].name}</span>`;

/* ---------- question builders ---------- */
function photoQs(){
  const places = PICS.filter(p => IMG[p.id]).map(p => {
    const others = shuffle(PICS.filter(x => x.id !== p.id).map(x => x.name)).slice(0, 2);
    return { block:"photo", img:p.id, q:"Что изображено на картинке?", a:p.name,
      opts: shuffle([p.name, ...others, PIC_EXTRA[Math.floor(Math.random() * PIC_EXTRA.length)]]), e:p.fact };
  });
  const people = VARNA_PICS.filter(p => IMG[p.id]).map(p => ({ block:"photo", img:p.id,
    q:"Представитель какой варны изображён?", a:VARNAS[p.v].name, opts:varnaNames, fixed:true, e:p.e }));
  return [...places, ...people];
}
const fromList = (list, block) => list.map(x => ({ block, q:x.q, a:x.a, opts: shuffle([x.a, ...x.w]), e:x.e }));
const orderQs = () => ORDER.map(x => ({ block:"order", type:"order", q:x.q, items:x.items, a:x.items.join(" → "), opts: shuffle(x.items), e:x.e }));
const varnaQs = () => [
  ...VARNA_Q.map(x => ({ block:"varna", q:x.q, a:VARNAS[x.v].name, opts:varnaNames, fixed:true, e:x.e })),
  ...fromList(VARNA_MORE, "varna")
];

const BLOCKS = {

  facts:{n:"Блок 5", title:"Природа и города", desc:"Индостан, Хараппа и Мохенджо-Даро.", make:()=>shuffle(fromList(FACTS,"facts"))},

/* ---------- screens ---------- */
let S = null; // quiz state

function menu(){
  S = null;
  const best = store.get() || {};
  const card = (k, cls="") => {
    const b = BLOCKS[k]; const count = k==="final" ? 20 : b.make().length;

  };
  app.innerHTML = `

    </header>
    <div class="eras">
      <div class="era"><b>Хараппа</b>3-е тыс. до н. э.</div>
      <div class="era"><b>Арии</b>2-е тыс. до н. э.</div>
      <div class="era"><b>Маурьи</b>IV–III вв. до н. э.</div>

    <div class="blocks">${["photo","dates","order","people","facts","varna","book"].map(k=>card(k)).join("")}${card("final","final")}</div>
    <div class="row"><button class="btn" id="study">Повторить материал перед тестом</button></div>`;
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => start(b.dataset.go));
  $("#study").onclick = study;

function start(key, list){
  S = { key, qs: list || BLOCKS[key].make(), i:0, res:[], pick:[] };
  render();
}

function render(){
  const q = S.qs[S.i];
  S.pick = [];
  const beads = S.qs.map((_,k)=>{
    const r = S.res[k]; return `<span class="bead ${r===undefined ? (k===S.i?"cur":"") : (r.ok?"ok":"no")}"></span>`;
  }).join("");
  const img = q.img && IMG[q.img] ? `<img class="qimg" src="${IMG[q.img]}" alt="">` : "";
  const hint = q.type==="order" ? `<p class="qhint">Нажимай варианты по порядку. Нажмёшь ещё раз — отменишь выбор.</p>` : "";
  app.innerHTML = `
    <div class="qtop"><button class="btn ghost" id="back">← Меню</button><span class="eyebrow">${BLOCKS[S.key].title} · ${S.i+1} из ${S.qs.length}</span></div>
    <div class="beads" aria-hidden="true">${beads}</div>
    <div class="card">
      ${img}
      <p class="qtext">${esc(q.q)}</p>${hint}
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${q.type==="order"?"":k+1}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div id="fb"></div>
    </div>`;
  $("#back").onclick = menu;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => q.type==="order" ? pickOrder(+b.dataset.k) : answer(+b.dataset.k));
  window.scrollTo(0,0);
}

function pickOrder(k){
  if (S.res[S.i]) return;
  const q = S.qs[S.i]; const at = S.pick.indexOf(k);
  if (at >= 0) S.pick = S.pick.slice(0, at); else S.pick.push(k);
  app.querySelectorAll(".opt").forEach((b,j)=>{
    const n = S.pick.indexOf(j);
    b.classList.toggle("picked", n >= 0);
    b.querySelector(".k").textContent = n >= 0 ? n+1 : "";
  });
  $("#fb").innerHTML = S.pick.length === q.opts.length
    ? `<div class="row"><button class="btn primary" id="check">Проверить</button></div>` : "";
  if ($("#check")) { $("#check").onclick = checkOrder; $("#check").focus({preventScroll:true}); }
}

function checkOrder(){
  const q = S.qs[S.i]; const seq = S.pick.map(k => q.opts[k]);
  const ok = seq.join("|") === q.items.join("|");
  S.res[S.i] = { ok, pick: seq.join(" → ") };
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    b.classList.remove("picked");
    b.classList.add(q.items.indexOf(q.opts[j]) === S.pick.indexOf(j) ? "right" : "wrong");
  });
  const list = ok ? "" : `<ol>${q.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;
  feedback(ok, ok ? "Верно!" : "Порядок неверный. Правильно так:", list + `<span>${esc(q.e)}</span>`);
}

function answer(k){
  if (S.res[S.i]) return;
  const q = S.qs[S.i]; const pick = q.opts[k]; const ok = pick === q.a;
  S.res[S.i] = { ok, pick };
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if (q.opts[j] === q.a) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  feedback(ok, ok ? "Верно!" : "Неверно. Правильный ответ: " + esc(q.a), `<span>${esc(q.e)}</span>`);
}

function feedback(ok, head, body){
  const bead = app.querySelectorAll(".bead")[S.i]; bead.className = "bead " + (ok?"ok":"no");
  const last = S.i === S.qs.length - 1;
  $("#fb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${head}</b>${body}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="next">${last?"Показать результат":"Дальше →"}</button></div>`;
  $("#next").onclick = () => { if (last) results(); else { S.i++; render(); } };
  $("#next").focus({preventScroll:true});
}

function grade(p){ return p>=90?5 : p>=70?4 : p>=50?3 : 2; }

function results(){
  const right = S.res.filter(r=>r.ok).length, total = S.qs.length, p = Math.round(right/total*100);
  const g = grade(p);
  if (!S.retry){ const best = store.get() || {}; if (!best[S.key] || p > best[S.key]) { best[S.key] = p; store.set(best); } }
  const wrong = S.qs.map((q,k)=>({q, r:S.res[k]})).filter(x=>!x.r.ok);
  const words = {5:"Отлично!",4:"Хорошо!",3:"Неплохо, но стоит повторить.",2:"Нужно ещё раз повторить параграф."};
  app.innerHTML = `
    <div class="qtop"><button class="btn ghost" id="back">← Меню</button><span class="eyebrow">${BLOCKS[S.key].title}${S.retry?" · работа над ошибками":""}</span></div>
    <div class="card">
      <div class="score"><div class="grade">${g}</div>
        <div style="display:flex;flex-direction:column;gap:4px"><h2>${words[g]}</h2><p>Правильно ${right} из ${total} (${p}%)</p>
        <p class="lead" style="font-size:.85rem">Оценка: 90% и больше — «5», 70% — «4», 50% — «3».</p></div></div>
      <div class="row">
        ${wrong.length?`<button class="btn primary" id="fix">Исправить ошибки (${wrong.length})</button>`:""}
        <button class="btn" id="again">Пройти заново</button>
        <button class="btn ghost" id="study2">Повторить материал</button>
      </div>
    </div>
    ${wrong.length?`<div class="card"><h2>Разбор ошибок</h2><div class="mist">${wrong.map(x=>`
      <div class="mi">${x.q.img&&IMG[x.q.img]?`<img class="mthumb" src="${IMG[x.q.img]}" alt="">`:""}<span>${esc(x.q.q)}</span><span class="y">Ответ: ${esc(x.r.pick)}</span><span class="c">Правильно: ${esc(x.q.a)}</span></div>`).join("")}</div></div>`:""}`;
  $("#back").onclick = menu;
  $("#study2").onclick = study;
  $("#again").onclick = () => start(S.key);
  if (wrong.length) $("#fix").onclick = () => {
    const key = S.key;
    const qs = shuffle(wrong.map(x => ({...x.q, opts: x.q.fixed ? x.q.opts : shuffle(x.q.opts)})));
    start(key, qs); S.retry = true;
  };
  window.scrollTo(0,0);
}

          <div><dt>Арии</dt> <dd>— племена, пришедшие с северо-запада в середине 2-го тысячелетия до н. э.</dd></div>
          <div><dt>Санскрит</dt> <dd>— язык ариев, древний язык Индии.</dd></div>
          <div><dt>Раджи</dt> <dd>— вожди арийских племён, позже ставшие царями.</dd></div>
          <div><dt>Варна</dt> <dd>— на санскрите «сорт», «категория»: группа людей со строго определёнными занятиями, правами и обязанностями.</dd></div>
          <div><dt>Калинга</dt> <dd>— небольшое государство на востоке Индостана, которое завоевал Ашока.</dd></div>
          <div><dt>Брахма</dt> <dd>— главный индийский бог, по легенде создавший варны.</dd></div>
        </dl>
      </section>

      <section><h2>Ответы на вопросы учебника</h2>
        <p class="note">Нажми на вопрос, чтобы открыть ответ. Сначала попробуй ответить сам.</p>
        <div class="qa">
          ${qa("Главный вопрос: в чём заключается особенность цивилизации Древней Индии?", `
            <p>Особенность Древней Индии — <b>деление общества на варны</b>: брахманы, кшатрии, вайшьи и шудры. Человек всю жизнь оставался в варне отца.</p>
            <p>Аргументы:</p><ol>
            <li>По легенде, варны создал сам бог Брахма, поэтому порядок считался священным.</li>
            <li>По закону перейти из варны в варну было нельзя, варны различались даже домами и одеждой.</li>
            <li>Ещё одна особенность — древнейшие города (Мохенджо-Даро, Хараппа) были очень благоустроены: прямые улицы, кирпичные дома, колодцы, канал для грязной воды, бассейн.</li></ol>`)}
          ${qa("Чем занималось население Древней Индии? В каких странах был такой же тип хозяйства?", `
            <p>Земледелием (и скотоводством) в плодородных долинах рек Инда и Ганга. Такое же хозяйство было в <b>Древнем Египте</b> (река Нил) и в <b>Междуречье</b> (Тигр и Евфрат).</p>`)}
          ${qa("Приведите примеры, что хараппская цивилизация отличалась высоким уровнем развития.", `
            <ul><li>Знали ремёсла, имели письменность, умели плавить медь.</li>
            <li>Прямые широкие улицы, двух- и трёхэтажные дома из обожжённого кирпича, закруглённые углы на перекрёстках.</li>
            <li>Почти в каждом доме — колодец и комната для омовений; грязная вода уходила по каналу за город.</li>
            <li>Плавательный бассейн, крепость с дворцом и амбаром для зерна.</li>
            <li>Торговали с Месопотамией.</li></ul>`)}
          ${qa("Найдите на карте Мохенджо-Даро и Хараппу. Какие условия благоприятствовали их развитию?", `
            <p>Оба города стоят на <b>реке Инд</b>, на северо-западе Индостана (сейчас это Пакистан). Помогли развитию плодородная долина реки, вода для полей и людей, тёплый климат, а река служила дорогой для торговли.</p>`)}
          ${qa("Какую роль сыграли арии в истории Древней Индии?", `
            <ul><li>Принесли язык санскрит.</li>
            <li>Перешли от скотоводства к земледелию и смешались с жителями Северной Индии.</li>
            <li>Их вожди-раджи стали царями — появились царства.</li>
            <li>Их потомки-индийцы научились добывать и обрабатывать железо.</li></ul>`)}
          ${qa("Представители каких варн изображены на рисунке «Индийские варны»?", `
            <p>Всех четырёх: брахман — мудрец в белой одежде, кшатрий — воин с мечом, вайшья — общинник (земледелец, ремесленник, купец), шудра — слуга за работой.</p>`)}
          ${qa("Какие варны существовали в Индии и чем они различались?", `
            <p>Брахманы (жрецы), кшатрии (воины), вайшьи (земледельцы, ремесленники и купцы), шудры (слуги). Различались занятиями, правами и обязанностями, а также домами, покроем и цветом одежды.</p>`)}
          ${qa("1. Какие династии правили в Древней Индии? Чем отличалось их правление?", `
            <p><b>Маурьи</b> (конец IV — III век до н. э.): Чандрагупта объединил север, при Ашоке власть распространилась почти на всю Индию. Объединяли страну войнами; Ашока потом отказался от войн. Государство вскоре распалось после смерти Ашоки.</p>
            <p><b>Гупты</b> (IV–VI века н. э.): Самудрагупта вновь объединил Северную Индию, при Чандрагупте II — «золотой век»: развивались наука и искусство. Державу уничтожили кочевники.</p>`)}
          ${qa("2. Когда возникла династия Маурьев? В какое время и почему она достигла расцвета?", `
            <p>Империя Маурьев возникла в <b>конце IV века до н. э.</b>, когда Чандрагупта подчинил север Индии. Расцвета она достигла при Ашоке, в <b>середине III века до н. э.</b>: он продолжил завоевания деда и отца и занял почти весь Индостан, а после завоевания Калинга отказался от войн и жестокости.</p>`)}
          ${qa("3. Почему в Древней Индии сложилась структура общества из варн? Сохранилась ли она в наше время?", `
            <p>Занятия переходили от отца к сыну, а легенда о Брахме объявила этот порядок священным — его нельзя было нарушать. Так у каждого было своё место и дело.</p>
            <p>Деление на группы по рождению держалось в Индии очень долго. Сейчас по закону Индии все граждане равны, но кое-где следы этого деления остаются в обычаях. <span class="note">(Это уже не из учебника — можно сказать как дополнение.)</span></p>`)}
          ${qa("4. Сравните образ жизни в Древней Индии и странах Междуречья. В чём сходство? В чём отличие?", `
            <p><b>Сходство:</b> цивилизации возникли в долинах больших рек (Инд и Ганг — Тигр и Евфрат), главное занятие — земледелие, реки разливались, строили города из кирпича, были ремёсла, письменность и торговля (вещи с Инда нашли в Месопотамии).</p>
            <p><b>Отличие:</b> в Индии климат жаркий и влажный, с сезоном дождей, много джунглей и болот; общество делилось на варны, говорили на санскрите. В Междуречье жарко и мало дождей, там свои законы (царя Хаммурапи) и храмы-зиккураты.</p>`)}
          ${qa("5. Подготовьте сообщение о культуре ариев и её влиянии на культуру Древней Индии.", `
            <p>План сообщения:</p><ol>
            <li>Кто такие арии и откуда пришли (северо-запад, середина 2-го тысячелетия до н. э.).</li>
            <li>Язык санскрит — на нём записаны Веды, древние священные книги индийцев (их упоминают законы Ману).</li>
            <li>Занятия: сначала скотоводство, потом земледелие.</li>
            <li>Вожди-раджи стали царями; деление на варны.</li>
            <li>Влияние: санскрит, Веды и варны надолго стали основой культуры Индии.</li></ol>
            <p class="note">Это задание на поиск в дополнительных источниках — здесь только план.</p>`)}
          ${qa("Работаем с источником: о каких варнах говорится в законах Ману?", `
            <ol><li>Пастьба скота, торговля, земледелие — <b>вайшьи</b>.</li>
            <li>Охрана подданных — <b>кшатрии</b>.</li>
            <li>Обучение, изучение Веды, жертвоприношения за других — <b>брахманы</b>.</li>
            <li>Служение этим варнам со смирением — <b>шудры</b>.</li>
            <li>Имущество — собаки и ослы, пища в разбитой посуде, постоянно кочевать — это люди <b>вне варн</b>, «неприкасаемые». Они стояли ниже всех варн.</li></ol>`)}
          ${qa("Работаем с понятиями: кшатрии, вайшья, сатрапии, брахманы, варны. Какое понятие лишнее?", `
            <p>Лишнее — <b>сатрапии</b>. Это области Персидского царства (§ 16), а остальные понятия относятся к варнам Древней Индии.</p>`)}
        </div>
      </section>
    </div>
    <div class="row"><button class="btn primary" id="go">К тесту</button></div>`;
  $("#back").onclick = menu; $("#go").onclick = menu;
  window.scrollTo(0,0);
}

document.addEventListener("keydown", e => {
  if (!S) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 9 && !S.res[S.i]) { const b = app.querySelector(`.opt[data-k="${n-1}"]`); if (b) b.click(); }
  else if (e.key === "Enter" && S.res[S.i]) { const nx = $("#next"); if (nx && document.activeElement !== nx) nx.click(); }
});

menu();
</script>
